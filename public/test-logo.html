<!DOCTYPE html>
<html>
<head>
<title>Flash Solar Logo Inspection</title>
<style>
body { background: #061321; color: #f7f7f5; font-family: sans-serif; padding: 40px; }
.card { background: #0a192f; border: 1px solid #1e3a5f; padding: 20px; border-radius: 8px; margin-bottom: 30px; }
h2 { color: #f2b33f; margin-top: 0; }
img { max-width: 100%; height: auto; }
</style>
</head>
<body>
<h1>Flash Solar Logo Assets</h1>

<div class="card">
  <h2>1. Current public/images/logo.png (on #061321 background)</h2>
  <div style="background: #061321; padding: 20px; display: inline-block; border: 1px dashed #f2b33f;">
    <img src="/images/logo.png" style="height: 60px;" alt="logo.png">
  </div>
</div>

<div class="card">
  <h2>2. Original FLASH-LEAD-ACID.jpg (2481x2481)</h2>
  <div style="background: white; padding: 20px; display: inline-block;">
    <img src="/images/FLASH-LEAD-ACID.jpg" style="height: 150px;" alt="original">
  </div>
</div>

<div class="card">
  <h2>3. Proposed Brand Lockup (Header Style)</h2>
  <div style="display: flex; align-items: center; gap: 14px; background: #061321; padding: 12px 24px; border-radius: 8px; border: 1px solid #1e3a5f; width: fit-content;">
    <img src="/images/logo.png" style="height: 40px; width: auto; object-fit: contain;" alt="Brand Icon">
    <div style="display: flex; flex-direction: column;">
      <span style="font-family: serif; font-weight: 800; font-size: 22px; line-height: 1.1; letter-spacing: -0.02em; color: #f7f7f5;">
        FLASH <span style="color: #f2b33f;">SOLAR</span>
      </span>
      <span style="font-size: 10px; font-family: monospace; letter-spacing: 0.2em; text-transform: uppercase; color: #94a3b8; margin-top: 2px;">
        Clean Energy Storage
      </span>
    </div>
  </div>
</div>

</body>
</html>
