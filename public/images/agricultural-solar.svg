<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="agriSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040D17" />
      <stop offset="70%" stop-color="#0A1D15" />
      <stop offset="100%" stop-color="#102E20" />
    </linearGradient>
    <filter id="agriGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#agriSky)" />

  <!-- Rolling Agricultural Terrain -->
  <path d="M 0,380 Q 200,340 400,380 T 800,360 L 800,600 L 0,600 Z" fill="#040F0A" />
  <path d="M 0,440 Q 250,400 500,440 T 800,420 L 800,600 L 0,600 Z" fill="#020805" />

  <!-- Agricultural Solar Tracking Array -->
  <g transform="translate(180, 260)">
    <!-- Mount Post -->
    <line x1="120" y1="60" x2="120" y2="160" stroke="#475569" stroke-width="6" />
    <polygon points="100,160 140,160 150,180 90,180" fill="#1E293B" />

    <!-- Tilted Solar Tracking Panel -->
    <polygon points="20,50 220,10 240,70 40,110" fill="#0E2D4E" stroke="#38BDF8" stroke-width="2" />
    <line x1="75" y1="40" x2="95" y2="100" stroke="#1E3E62" stroke-width="1.5" />
    <line x1="130" y1="30" x2="150" y2="90" stroke="#1E3E62" stroke-width="1.5" />
    <line x1="185" y1="20" x2="205" y2="80" stroke="#1E3E62" stroke-width="1.5" />
  </g>

  <!-- Solar Direct-Drive DC Well Water Pump & Reservoir -->
  <g transform="translate(480, 360)">
    <!-- Water Tank -->
    <rect x="100" y="0" width="110" height="130" rx="6" fill="#0C202F" stroke="#29445E" stroke-width="2" />
    <text x="155" y="40" font-family="monospace" font-size="9" fill="#38BDF8" text-anchor="middle">WATER RESERVOIR</text>
    <text x="155" y="65" font-family="monospace" font-size="14" font-weight="bold" fill="#F7F7F5" text-anchor="middle">SOLAR DC PUMP</text>

    <!-- DC Submersible Pump Station -->
    <rect x="0" y="70" width="60" height="60" rx="4" fill="#071510" stroke="#10B981" stroke-width="2" />
    <circle cx="30" cy="100" r="14" fill="#0F2E20" />
    <path d="M 30,90 L 30,110 M 20,100 L 40,100" stroke="#10B981" stroke-width="2" />
    <text x="30" y="145" font-family="monospace" font-size="8" fill="#34D399" text-anchor="middle">DIRECT DC DRIVE</text>
  </g>

  <!-- DC Power Line From Solar Directly to Pump (Zero Inverter Needed) -->
  <path d="M 300,320 L 480,430" stroke="#F2B33F" stroke-width="3" fill="none" filter="url(#agriGlow)" />
  <path d="M 540,430 L 580,430" stroke="#38BDF8" stroke-width="4" fill="none" stroke-linecap="round" />

  <text x="400" y="550" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#F7F7F5" text-anchor="middle" letter-spacing="2">
    AGRICULTURAL DIRECT DC SOLAR IRRIGATION • ZERO GRID DEPENDENCE
  </text>
</svg>
