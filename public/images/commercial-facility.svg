<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="commSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040D17" />
      <stop offset="60%" stop-color="#0A192B" />
      <stop offset="100%" stop-color="#0F2238" />
    </linearGradient>
    <linearGradient id="containerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142C47" />
      <stop offset="50%" stop-color="#0E1F33" />
      <stop offset="100%" stop-color="#091421" />
    </linearGradient>
    <filter id="commGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#commSky)" />

  <!-- Ground Plane -->
  <polygon points="0,420 800,420 800,600 0,600" fill="#03080F" />
  <line x1="0" y1="420" x2="800" y2="420" stroke="#1A334F" stroke-width="1.5" />

  <!-- Solar Farm Arrays in Background -->
  <g opacity="0.6">
    <polygon points="50,380 160,350 280,380 170,410" fill="#0A223B" stroke="#2563EB" stroke-width="1" />
    <polygon points="200,380 310,350 430,380 320,410" fill="#0A223B" stroke="#2563EB" stroke-width="1" />
    <polygon points="350,380 460,350 580,380 470,410" fill="#0A223B" stroke="#2563EB" stroke-width="1" />
    <polygon points="500,380 610,350 730,380 620,410" fill="#0A223B" stroke="#2563EB" stroke-width="1" />
  </g>

  <!-- Large Industrial BESS Container (Battery Energy Storage System) -->
  <g transform="translate(180, 240)">
    <!-- Container Body -->
    <rect x="0" y="0" width="440" height="190" rx="8" fill="url(#containerGrad)" stroke="#29445E" stroke-width="2" />

    <!-- Corrugated Container Lines -->
    <g stroke="#0A1828" stroke-width="2">
      <line x1="60" y1="10" x2="60" y2="180" />
      <line x1="120" y1="10" x2="120" y2="180" />
      <line x1="180" y1="10" x2="180" y2="180" />
      <line x1="240" y1="10" x2="240" y2="180" />
      <line x1="300" y1="10" x2="300" y2="180" />
      <line x1="360" y1="10" x2="360" y2="180" />
    </g>

    <!-- Heavy Industrial Access Doors -->
    <rect x="25" y="25" width="80" height="150" rx="4" fill="#081422" stroke="#1E3E62" stroke-width="1.5" />
    <rect x="115" y="25" width="80" height="150" rx="4" fill="#081422" stroke="#1E3E62" stroke-width="1.5" />

    <!-- Industrial HVAC Chiller Fans on Top -->
    <rect x="40" y="-25" width="80" height="25" rx="3" fill="#0D1E30" stroke="#29445E" stroke-width="1.5" />
    <circle cx="80" cy="-12" r="7" fill="#F2B33F" opacity="0.8" />
    
    <rect x="150" y="-25" width="80" height="25" rx="3" fill="#0D1E30" stroke="#29445E" stroke-width="1.5" />
    <circle cx="190" cy="-12" r="7" fill="#F2B33F" opacity="0.8" />

    <!-- Main Electrical Panel & Branding -->
    <rect x="220" y="30" width="190" height="140" rx="6" fill="#091624" stroke="#1A334F" stroke-width="1.5" />
    <text x="315" y="65" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#F7F7F5" text-anchor="middle" letter-spacing="4">
      FLASH <tspan fill="#F2B33F">SOLAR</tspan>
    </text>
    <text x="315" y="85" font-family="monospace" font-size="9" fill="#10B981" text-anchor="middle" letter-spacing="2">
      MEGAWATT BESS • 1.2 MWh
    </text>

    <!-- Telemetry Status Bar -->
    <rect x="245" y="105" width="140" height="6" rx="3" fill="#10B981" filter="url(#commGlow)" />
    <text x="315" y="130" font-family="monospace" font-size="8" fill="#B6C1D0" text-anchor="middle">
      HV TRANSFORMER • 400V 3-PHASE
    </text>
  </g>

  <!-- Power Cables Conduit -->
  <path d="M 620,380 L 740,380 L 740,500" stroke="#F2B33F" stroke-width="4" fill="none" filter="url(#commGlow)" />
</svg>
