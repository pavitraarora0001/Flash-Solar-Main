<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040D17" />
      <stop offset="60%" stop-color="#091A2E" />
      <stop offset="100%" stop-color="#10253D" />
    </linearGradient>
    <linearGradient id="sunRay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD17A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F2B33F" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123B64" />
      <stop offset="100%" stop-color="#091E34" />
    </linearGradient>
    <linearGradient id="dcWireFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2B33F" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="glowDC" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky & Ambient Atmosphere -->
  <rect width="800" height="600" fill="url(#skyGrad)" />

  <!-- Solar Inflow Energy Beam (Golden Hour Sunlight) -->
  <polygon points="120,0 280,0 350,180 150,180" fill="url(#sunRay)" opacity="0.35" />

  <!-- Modern House Silhouette & Cross-Section -->
  <polygon points="200,200 400,90 650,200 650,520 200,520" fill="#061321" stroke="#29445E" stroke-width="2" />
  
  <!-- Rooftop Solar PV Arrays -->
  <g transform="translate(230, 110) rotate(28)">
    <rect x="0" y="0" width="190" height="70" rx="4" fill="url(#panelGrad)" stroke="#38BDF8" stroke-width="1.5" />
    <!-- Solar Cells Grid -->
    <line x1="38" y1="0" x2="38" y2="70" stroke="#1E3E62" stroke-width="1" />
    <line x1="76" y1="0" x2="76" y2="70" stroke="#1E3E62" stroke-width="1" />
    <line x1="114" y1="0" x2="114" y2="70" stroke="#1E3E62" stroke-width="1" />
    <line x1="152" y1="0" x2="152" y2="70" stroke="#1E3E62" stroke-width="1" />
    <line x1="0" y1="35" x2="190" y2="35" stroke="#1E3E62" stroke-width="1" />
  </g>

  <!-- House Interior Floor Dividers -->
  <line x1="200" y1="360" x2="650" y2="360" stroke="#182C44" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Room 1 (Upper Floor): DC LED Lighting & BLDC Ceiling Fan -->
  <g transform="translate(260, 240)">
    <!-- BLDC Fan -->
    <circle cx="90" cy="20" r="8" fill="#F2B33F" filter="url(#glowDC)" />
    <ellipse cx="90" cy="20" rx="35" ry="5" fill="#B6C1D0" opacity="0.7" />
    <text x="90" y="45" font-family="monospace" font-size="9" fill="#FFD17A" text-anchor="middle">48V DC BRUSHLESS FAN</text>

    <!-- DC High-CRI LED Array -->
    <rect x="230" y="15" width="80" height="6" rx="3" fill="#34D399" filter="url(#glowDC)" />
    <text x="270" y="45" font-family="monospace" font-size="9" fill="#34D399" text-anchor="middle">12V DC DIRECT LEDS</text>
  </g>

  <!-- Room 2 (Lower Floor): Flash Power Wall Battery & MPPT Hub -->
  <g transform="translate(250, 400)">
    <!-- Flash Power Wall Unit -->
    <rect x="20" y="10" width="75" height="95" rx="6" fill="#101F32" stroke="#F2B33F" stroke-width="2" />
    <rect x="30" y="25" width="55" height="4" rx="2" fill="#10B981" filter="url(#glowDC)" />
    <text x="57" y="60" font-family="monospace" font-size="8" fill="#F7F7F5" text-anchor="middle">FLASH</text>
    <text x="57" y="70" font-family="monospace" font-size="8" font-weight="bold" fill="#F2B33F" text-anchor="middle">POWER WALL</text>
    <text x="57" y="120" font-family="monospace" font-size="9" fill="#FFD17A" text-anchor="middle">LiFePO4 51.2V</text>

    <!-- DC Refrigeration Compressor Unit -->
    <rect x="240" y="20" width="70" height="85" rx="5" fill="#0C1B2B" stroke="#29445E" stroke-width="1.5" />
    <rect x="248" y="30" width="54" height="2" fill="#38BDF8" />
    <text x="275" y="65" font-family="monospace" font-size="8" fill="#B6C1D0" text-anchor="middle">DC COOLING</text>
    <text x="275" y="120" font-family="monospace" font-size="9" fill="#34D399" text-anchor="middle">48V BLDC PUMP</text>
  </g>

  <!-- Pure DC Native Bus Lines (Zero Inverter Loss) -->
  <path d="M 330,170 L 330,420 L 290,420" stroke="#F2B33F" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glowDC)" />
  <path d="M 325,435 L 525,435 L 525,420" stroke="#34D399" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glowDC)" />
  <path d="M 330,300 L 350,260" stroke="#F2B33F" stroke-width="2" fill="none" stroke-dasharray="4,4" />
  <path d="M 330,280 L 490,255" stroke="#34D399" stroke-width="2" fill="none" stroke-dasharray="4,4" />

  <!-- Efficiency Metric Badge -->
  <g transform="translate(540, 280)">
    <rect x="0" y="0" width="160" height="65" rx="8" fill="#061321" stroke="#10B981" stroke-width="1.5" filter="url(#glowDC)" />
    <text x="15" y="22" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#34D399">FLASH DC EFFICIENCY</text>
    <text x="15" y="45" font-family="monospace" font-size="20" font-weight="bold" fill="#F7F7F5">0% LOSS</text>
    <text x="15" y="58" font-family="system-ui, sans-serif" font-size="8" fill="#B6C1D0">NO INVERTER CONVERSION</text>
  </g>
</svg>
