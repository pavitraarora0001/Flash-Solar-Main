<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyAC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040D17" />
      <stop offset="70%" stop-color="#0D2035" />
      <stop offset="100%" stop-color="#122A46" />
    </linearGradient>
    <linearGradient id="invGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3E62" />
      <stop offset="100%" stop-color="#0F2135" />
    </linearGradient>
    <filter id="glowAC" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#skyAC)" />

  <!-- Modern Hybrid Building -->
  <polygon points="180,220 380,100 620,220 620,520 180,520" fill="#081524" stroke="#29445E" stroke-width="2" />

  <!-- Rooftop Solar Array -->
  <polygon points="210,210 375,115 520,195 355,290" fill="#0E2D4E" stroke="#38BDF8" stroke-width="1.5" />
  <line x1="260" y1="180" x2="410" y2="255" stroke="#1E3E62" stroke-width="1" />
  <line x1="310" y1="150" x2="460" y2="225" stroke="#1E3E62" stroke-width="1" />

  <!-- Central Hybrid Inverter Station -->
  <g transform="translate(420, 340)">
    <rect x="0" y="0" width="130" height="150" rx="8" fill="url(#invGrad)" stroke="#F2B33F" stroke-width="2" />
    <rect x="15" y="20" width="100" height="40" rx="4" fill="#061321" stroke="#29445E" stroke-width="1" />
    <text x="65" y="45" font-family="monospace" font-size="12" font-weight="bold" fill="#38BDF8" text-anchor="middle">230V AC</text>
    <text x="65" y="100" font-family="system-ui, sans-serif" font-size="9" fill="#F7F7F5" text-anchor="middle">SMART HYBRID</text>
    <text x="65" y="115" font-family="system-ui, sans-serif" font-size="8" fill="#F2B33F" text-anchor="middle">PURE SINE WAVE</text>
  </g>

  <!-- Flash Battery Bank -->
  <g transform="translate(240, 360)">
    <rect x="0" y="0" width="120" height="130" rx="8" fill="#0C1B2B" stroke="#29445E" stroke-width="2" />
    <rect x="15" y="20" width="90" height="8" rx="4" fill="#10B981" filter="url(#glowAC)" />
    <text x="60" y="55" font-family="monospace" font-size="10" font-weight="bold" fill="#F7F7F5" text-anchor="middle">BATTERY</text>
    <text x="60" y="70" font-family="monospace" font-size="9" fill="#F2B33F" text-anchor="middle">51.2V LiFePO4</text>
  </g>

  <!-- External Utility Grid Connection Post -->
  <g transform="translate(680, 280)">
    <line x1="20" y1="0" x2="20" y2="240" stroke="#475569" stroke-width="3" />
    <line x1="5" y1="40" x2="35" y2="40" stroke="#475569" stroke-width="2" />
    <line x1="5" y1="70" x2="35" y2="70" stroke="#475569" stroke-width="2" />
    <circle cx="20" cy="40" r="4" fill="#F2B33F" />
    <circle cx="20" cy="70" r="4" fill="#F2B33F" />
    <text x="20" y="260" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">GRID FEED</text>
  </g>

  <!-- Synchronized Grid Fallback Flow Lines -->
  <path d="M 680,320 L 550,380" stroke="#F2B33F" stroke-width="2" stroke-dasharray="4,4" fill="none" />
  <path d="M 360,420 L 420,420" stroke="#10B981" stroke-width="3" fill="none" filter="url(#glowAC)" />
  <path d="M 350,290 L 485,340" stroke="#38BDF8" stroke-width="2.5" fill="none" filter="url(#glowAC)" />

  <text x="400" y="550" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#F7F7F5" text-anchor="middle" letter-spacing="2">
    FLASH AC HOUSE • AUTOMATIC GRID &amp; SOLAR SYNCHRONIZATION
  </text>
</svg>
