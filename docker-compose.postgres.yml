services:
  postgres:
    image: postgres:16-alpine
    container_name: flashsolar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flashsolar_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flashsolar_dev_secure_pg_pass_2026}
    ports:
      - "5433:5432"
    volumes:
      - flashsolar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flashsolar_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  flashsolar_postgres_data:
    name: flashsolar_postgres_data
